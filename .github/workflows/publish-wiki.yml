name: Publish wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - 'docs/build_wiki.py'
      - 'docs/wiki-site.css'
      - 'docs/wiki-requirements.txt'
      - 'ground/tests/wiki_site.py'
      - 'ground/gcs/**'
      - '.github/workflows/publish-wiki.yml'
  pull_request:
    paths:
      - 'docs/wiki/**'
      - 'docs/build_wiki.py'
      - 'docs/wiki-site.css'
      - 'docs/wiki-requirements.txt'
      - 'ground/tests/wiki_site.py'
      - 'ground/gcs/**'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Markdown renderer
        run: python3 -m pip install -r docs/wiki-requirements.txt
      - name: Test wiki builder
        run: python3 ground/tests/wiki_site.py
      - name: Build and validate pages and screenshots
        run: python3 docs/build_wiki.py --output build/wiki-site
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/wiki-site

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish wiki
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
